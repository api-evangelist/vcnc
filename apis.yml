aid: vcnc
name: VCNC
description: >-
  VCNC is a South Korean mobile technology company behind Between, a private
  messaging and photo-sharing app for couples, and TADA, a ride-hailing and
  mobility service operating in Korea. A 500 Global portfolio company, VCNC
  maintains an open source presence on GitHub, including Haeinsa, a multi-row
  transaction library for HBase published on Maven Central. The company does
  not currently publish a public developer API, developer portal, or API
  client SDKs.
